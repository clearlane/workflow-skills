name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # External link checking reaches the network, so it cannot sit in the
  # per-commit gate without letting a briefly unreachable third-party host
  # fail an unrelated change. On a schedule, a failure means "a link rotted".
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the current release. The
        # floor is load-bearing: scripts/document.py evaluates a PEP 604 union
        # at class-creation time, so an older runtime fails on import.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ruff reads its rules from pyproject.toml, so the version pinned here is
      # the only part of the lint result this file decides.
      - name: Install check dependencies
        run: python -m pip install -r requirements.txt "ruff==0.15.*"

      - name: Run every deterministic check
        run: python scripts/check.py

  links:
    # Network-dependent, so it reports separately from the deterministic gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install check dependencies
        run: python -m pip install -r requirements.txt

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --version

      - name: Verify external links
        env:
          CHECK_EXTERNAL_LINKS: "1"
        run: python scripts/check.py
